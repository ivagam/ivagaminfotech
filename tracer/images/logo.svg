<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 180"
     width="700" height="180"
     role="img" aria-labelledby="title desc">
  <title id="title">itracker logo - option 2</title>
  <desc id="desc">Clean transparent itracker logo with a modern gold location and signal icon and white wordmark.</desc>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="35%" stop-color="#FFD04A"/>
      <stop offset="75%" stop-color="#D99612"/>
      <stop offset="100%" stop-color="#F7CF63"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->

  <!-- Modern tracking icon -->
  <g transform="translate(22,15)">
    <!-- Outer circular tracking badge -->
    <circle cx="72" cy="75" r="58"
            fill="none"
            stroke="url(#gold)"
            stroke-width="7"/>

    <!-- Small route path -->
    <path d="M38 104 C49 82, 63 67, 86 53"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"/>

    <circle cx="38" cy="104" r="4.5" fill="#FFD04A"/>
    <circle cx="86" cy="53" r="4.5" fill="#FFD04A"/>

    <!-- Clean lowercase i -->
    <rect x="67" y="63" width="14" height="40" rx="7" fill="url(#gold)"/>
    <circle cx="74" cy="47" r="8" fill="url(#gold)"/>

    <!-- Signal waves -->
    <path d="M95 39 A30 30 0 0 1 108 52"
          fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M103 27 A47 47 0 0 1 121 45"
          fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M111 15 A64 64 0 0 1 134 38"
          fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- WHITE WORDMARK -->
  <text x="172" y="108"
        font-family="Poppins, Montserrat, Arial, Helvetica, sans-serif"
        font-size="86"
        font-weight="600"
        letter-spacing="-2.5"
        fill="#FFFFFF">itracker</text>

  <!-- Minimal gold accent -->
  <rect x="176" y="128" width="112" height="4" rx="2" fill="url(#gold)"/>
</svg>
